<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>로컬 인용 그래프 UI 시험</title>
<style>
:root{--bg:#0e1621;--panel:#162234;--line:#7890ac;--text:#eef5ff;--muted:#b4c2d2;--accent:#8bddb8;--starting:#63b3ed;--retained:#f6ad55;--support:#b794f4;--source:#fc8181}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}header{padding:16px 22px;border-bottom:1px solid #28415c}h1{font-size:20px;margin:0 0 4px}.note{color:var(--muted);margin:0}main{display:grid;grid-template-columns:minmax(650px,2fr) minmax(300px,1fr);min-height:calc(100vh - 92px)}#canvas{position:relative;min-height:720px;overflow:hidden;background:radial-gradient(circle at 20% 25%,#1d3045,transparent 35%),#0e1621}svg{position:absolute;inset:0;width:100%;height:100%}.edge{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#arrow)}.edge.backbone{stroke:#8bddb8;stroke-width:3}.node{position:absolute;transform:translate(-50%,-50%);width:122px;min-height:58px;padding:6px;border:2px solid #fff;border-radius:12px;color:#101923;text-align:center;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px #0008}.node:hover,.node:focus{outline:3px solid #fff;z-index:3}.starting{background:var(--starting)}.retained_source{background:var(--retained)}.supporting_source{background:var(--support)}.proposed_source_candidate{background:var(--source)}#tooltip{position:fixed;display:none;z-index:10;width:310px;padding:11px;background:#f7fbff;color:#142235;border:2px solid var(--accent);border-radius:10px;box-shadow:0 8px 30px #0008;font-size:13px;pointer-events:none}aside{padding:12px;border-left:1px solid #28415c;background:var(--panel);overflow:auto}aside h2{font-size:16px;margin:0 0 5px}.card{background:#0f1a29;border:1px solid #314b68;border-radius:9px;padding:7px;margin:4px 0;line-height:1.28}.label{font-size:11px;color:var(--muted)}.empty{color:#ffd28b}a{color:#9ee8ff}.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;margin-top:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px}@media(max-width:900px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #28415c}}
</style></head><body><header><h1>독립 로컬 인용 그래프 시험</h1><p class="note">입력: graphs/graph-output/graph.json만 사용 · 외부 URL 요청/외부 라이브러리 없음 · 화살표는 인용한 논문 → 인용된 논문</p><div class="legend"><span><i class="dot" style="background:#63b3ed"></i>시작</span><span><i class="dot" style="background:#f6ad55"></i>보존 소스</span><span><i class="dot" style="background:#b794f4"></i>지원 소스</span><span><i class="dot" style="background:#fc8181"></i>제안 소스 후보</span></div></header><main><section id="canvas" aria-label="인용 그래프"><svg id="edges" aria-hidden="true"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7890ac"/></marker></defs></svg></section><aside><h2>선택 상세</h2><div id="detail" class="card">노드를 클릭하면 입력 원장에 기록된 정보와 그래프에서 계산한 관계를 보여줘.</div><p class="label">‘확인 불가/미기록’은 graph.json에 해당 값이 없어서 보완 검색 없이 표시한 것이야.</p></aside></main><div id="tooltip"></div><script>
const G={"nodes": [{"id": "R1-01", "title": "UNVEIL: A Large-Scale, Automated Approach to Detecting Ransomware", "year": 2016, "role": "starting", "status": "proposed"}, {"id": "R1-02", "title": "The Aftermath of a Crypto-Ransomware Attack at a Large Academic Institution", "year": 2018, "role": "starting", "status": "proposed"}, {"id": "R1-03", "title": "Detecting Ransomware Despite I/O Overhead: A Practical Multi-Staged Approach", "year": 2025, "role": "starting", "status": "proposed"}, {"id": "R1-04", "title": "Ransom Access Memories: Achieving Practical Ransomware Protection in Cloud with DeftPunk", "year": 2024, "role": "starting", "status": "proposed"}, {"id": "R1-05", "title": "The Ransomware Decade: The Creation of a Fine-Grained Dataset and a Longitudinal Study", "year": 2025, "role": "starting", "status": "proposed"}, {"id": "R2-01", "title": "ShieldFS: a self-healing, ransomware-aware filesystem", "year": 2016, "role": "retained_source", "status": "proposed"}, {"id": "R2-02", "title": "Redemption: Real-Time Protection Against Ransomware at End-Hosts", "year": 2017, "role": "retained_source", "status": "proposed"}, {"id": "R2-03", "title": "PayBreak: Defense Against Cryptographic Ransomware", "year": 2017, "role": "supporting_source", "status": "proposed"}, {"id": "R3-02", "title": "Cutting the Gordian Knot: A Look Under the Hood of Ransomware Attacks", "year": 2016, "role": "proposed_source_candidate", "status": "proposed"}, {"id": "R3-04", "title": "Cryptovirology: Extortion-Based Security Threats and Countermeasures", "year": 1996, "role": "proposed_source_candidate", "status": "proposed"}], "seeds": ["R1-01", "R1-02", "R1-03", "R1-04", "R1-05"], "counts": {"R1-01": {"direct_seeds": ["R1-02", "R1-03", "R1-04"], "reachable_seeds": ["R1-02", "R1-03", "R1-04"]}, "R1-02": {"direct_seeds": [], "reachable_seeds": []}, "R1-03": {"direct_seeds": [], "reachable_seeds": []}, "R1-04": {"direct_seeds": [], "reachable_seeds": []}, "R1-05": {"direct_seeds": [], "reachable_seeds": []}, "R2-01": {"direct_seeds": ["R1-02", "R1-03"], "reachable_seeds": ["R1-02", "R1-03"]}, "R2-02": {"direct_seeds": ["R1-02", "R1-03", "R1-04"], "reachable_seeds": ["R1-02", "R1-03", "R1-04"]}, "R2-03": {"direct_seeds": ["R1-02"], "reachable_seeds": ["R1-02"]}, "R3-02": {"direct_seeds": [], "reachable_seeds": ["R1-02", "R1-03", "R1-04"]}, "R3-04": {"direct_seeds": [], "reachable_seeds": ["R1-02", "R1-03"]}}, "edges": [{"source": "R1-02", "target": "R1-01", "records": [{"source": "R1-02", "target": "R1-01", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-02 PDF 3,15"]}], "in_backbone": true}, {"source": "R1-02", "target": "R2-01", "records": [{"source": "R1-02", "target": "R2-01", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-02 PDF 3,15"]}], "in_backbone": true}, {"source": "R1-02", "target": "R2-02", "records": [{"source": "R1-02", "target": "R2-02", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-02 PDF 15"]}], "in_backbone": true}, {"source": "R1-02", "target": "R2-03", "records": [{"source": "R1-02", "target": "R2-03", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-02 PDF 3,15"]}], "in_backbone": true}, {"source": "R1-03", "target": "R1-01", "records": [{"source": "R1-03", "target": "R1-01", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-03 PDF 14"]}], "in_backbone": true}, {"source": "R1-03", "target": "R2-01", "records": [{"source": "R1-03", "target": "R2-01", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-03 PDF 14"]}], "in_backbone": false}, {"source": "R1-03", "target": "R2-02", "records": [{"source": "R1-03", "target": "R2-02", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-03 PDF 14"]}], "in_backbone": false}, {"source": "R1-04", "target": "R1-01", "records": [{"source": "R1-04", "target": "R1-01", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-04 PDF 17"]}], "in_backbone": true}, {"source": "R1-04", "target": "R2-02", "records": [{"source": "R1-04", "target": "R2-02", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round2_trace.tsv: R1-04 PDF 17"]}], "in_backbone": false}, {"source": "R2-01", "target": "R3-02", "records": [{"source": "R2-01", "target": "R3-02", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round3_trace.tsv: R2-01 PDF 11"]}], "in_backbone": true}, {"source": "R2-01", "target": "R3-04", "records": [{"source": "R2-01", "target": "R3-04", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round3_trace.tsv: R2-01 PDF 11"]}], "in_backbone": true}, {"source": "R2-02", "target": "R3-02", "records": [{"source": "R2-02", "target": "R3-02", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round3_trace.tsv: R2-02 PDF 21"]}], "in_backbone": false}, {"source": "R2-03", "target": "R3-02", "records": [{"source": "R2-03", "target": "R3-02", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round3_trace.tsv: R2-03 PDF 12"]}], "in_backbone": false}, {"source": "R2-03", "target": "R3-04", "records": [{"source": "R2-03", "target": "R3-04", "kind": "citation", "verification": "fulltext", "evidence": ["ledger/round3_trace.tsv: R2-03 PDF 12"]}], "in_backbone": false}], "backbone_pairs": [["R1-01", "R1-02"], ["R1-01", "R1-03"], ["R1-01", "R1-04"], ["R1-02", "R2-01"], ["R1-02", "R2-02"], ["R1-02", "R2-03"], ["R2-01", "R3-02"], ["R2-01", "R3-04"]], "excluded_edges": [], "components": 2, "policy": "Undirected maximum spanning forest; fulltext=2 metadata=1; not intellectual origin", "networkx_version": "3.6.1", "input_sha256": "6422754c77fbecf0d46a7bb025493346e78056206d0659fb0eeb02d058ed8b7f"};
const canvas=document.getElementById('canvas'), svg=document.getElementById('edges'), tip=document.getElementById('tooltip'), detail=document.getElementById('detail');
const pos=[[14,18],[40,13],[66,18],[83,37],[18,53],[43,43],[69,54],[87,70],[39,80],[65,84]];
const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
function esc(x){return String(x??'미기록').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function unavailable(v){return v===undefined||v===null||v===''?'확인 불가/미기록':esc(v)}
function role(v){return ({starting:'시작 논문',retained_source:'보존 소스',supporting_source:'지원 소스',proposed_source_candidate:'제안 소스 후보'}[v]||unavailable(v));}
function direct(n){const out=G.edges.filter(e=>e.source===n.id), inn=G.edges.filter(e=>e.target===n.id);return {out,inn}}
function reachableFromSeed(id){const seeds=new Set(G.seeds||[]);let count=0;for(const seed of seeds){let seen=new Set([seed]), q=[seed], hit=seed===id;while(q.length){for(const e of G.edges.filter(e=>e.source===q.shift()))if(!seen.has(e.target)){if(e.target===id)hit=true;seen.add(e.target);q.push(e.target)}}if(hit)count++}return count}
function oneLine(n){return `역할: ${role(n.role)} · 상태: ${unavailable(n.status)}`;}
function tooltip(n){return `<b>${esc(n.title)}</b><br>저자: 확인 불가/미기록<br>연도: ${unavailable(n.year)}<br>학회/저널: 확인 불가/미기록<br>한 줄 요약: ${oneLine(n)}`;}
function showDetail(n){const d=direct(n);const ev=[...d.out,...d.inn].flatMap(e=>e.records||[]).flatMap(r=>r.evidence||[]); detail.innerHTML=`<b>${esc(n.id)} · ${esc(n.title)}</b><div class="card"><span class="label">선정 이유</span><br>확인 불가/미기록</div><div class="card"><span class="label">검토 상태</span><br>${unavailable(n.status)}</div><div class="card"><span class="label">직접 관계 (입력 인용 간선)</span><br>인용함: ${d.out.length} · 인용됨: ${d.inn.length}</div><div class="card"><span class="label">간접 관계 (시작 노드에서 방향 경로로 도달)</span><br>도달 시작 노드 수: ${reachableFromSeed(n.id)} / ${(G.seeds||[]).length}</div><div class="card"><span class="label">근거</span><br>${ev.length?ev.map(esc).join('<br>'):'확인 불가/미기록'}</div><div class="card"><span class="label">원문 링크</span><br><span class="empty">확인 불가/미기록 (graph.json에 URL 필드 없음)</span></div>`;}
function draw(){const W=canvas.clientWidth,H=canvas.clientHeight;svg.querySelectorAll('line').forEach(x=>x.remove());G.edges.forEach(e=>{let a=G.nodes.findIndex(n=>n.id===e.source),b=G.nodes.findIndex(n=>n.id===e.target);let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',pos[a][0]+'%');line.setAttribute('y1',pos[a][1]+'%');line.setAttribute('x2',pos[b][0]+'%');line.setAttribute('y2',pos[b][1]+'%');line.setAttribute('class','edge '+(e.in_backbone?'backbone':''));svg.append(line)})}
G.nodes.forEach((n,i)=>{let b=document.createElement('button');b.className='node '+n.role;b.style.left=pos[i][0]+'%';b.style.top=pos[i][1]+'%';b.dataset.id=n.id;b.textContent=n.id+' / '+n.year;b.setAttribute('aria-label',n.title);b.onmouseenter=e=>{tip.innerHTML=tooltip(n);tip.style.display='block'};b.onmousemove=e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'};b.onmouseleave=()=>tip.style.display='none';b.onfocus=e=>{tip.innerHTML=tooltip(n);tip.style.display='block';tip.style.left='20px';tip.style.top='105px'};b.onblur=()=>tip.style.display='none';b.onclick=()=>showDetail(n);b.onpointerup=()=>showDetail(n);canvas.append(b)});draw();window.addEventListener('resize',draw);window.__localGraphTest={nodes:G.nodes.length,edges:G.edges.length,externalUrls:0};
</script></body></html>
