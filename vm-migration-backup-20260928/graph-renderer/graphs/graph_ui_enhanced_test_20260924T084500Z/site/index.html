'),search=document.querySelector('#search'),filter=document.querySelector('#filter'),count=document.querySelector('#count'),detail=document.querySelector('#detail');const P=[[12,15],[37,12],[64,16],[84,34],[16,49],[42,42],[68,53],[87,69],[38,80],[66,84]];const N=Object.fromEntries(G.nodes.map(n=>[n.id,n]));let selected=null;
const esc=v=>String(v??'미기록').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const miss=v=>v===undefined||v===null||v===''?'미기록':esc(v);const role=v=>({starting:'시작 논문',retained_source:'보존 소스',supporting_source:'지원 소스',proposed_source_candidate:'제안 소스 후보'}[v]||'미기록');
function visibleEdge(e){return filter.value==='all'||(e.records||[]).some(r=>r.verification===filter.value)}function match(n){let q=search.value.trim().toLowerCase();if(!q)return true;return [n.id,n.title,'미기록'].join(' ').toLowerCase().includes(q)}function related(n){let out=G.edges.filter(e=>e.source===n.id),inn=G.edges.filter(e=>e.target===n.id);return {out,inn}}
function refs(e,dir){return (e.records||[]).map(r=>`<li><b>${dir}</b> ${esc(e.source)} → ${esc(e.target)}<br><span class="label">확인: ${miss(r.verification)} · 근거: ${(r.evidence||[]).map(esc).join('; ')||'미기록'}</span></li>`).join('')}
