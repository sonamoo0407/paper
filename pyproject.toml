[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "root-paper-lab"
version = "0.1.0"
description = "Hermes research tools: auditable reference traversal and PaperQA analysis"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "httpx>=0.27,<1", "diskcache>=5.6,<6"]

[project.optional-dependencies]
analysis = ["paper-qa==2026.8.12"]

[project.scripts]
root-paper-lab = "root_paper_lab.server:main"

[tool.setuptools.packages.find]
include = ["root_paper_lab*"]
